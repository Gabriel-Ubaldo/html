<body>
<h2>What Can JavaScript Do?</h2>
<p>JavaScript can change HTML attribute values.</p>
<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>
<div style="display:grid; place-items: center;height: 300px;">
<img id="myImage" src="img/img1.png" style="width:100px">
<button onclick="document.getElementById('myImage').src='img/img1.png'">Apagar</button>
<button onclick="document.getElementById('myImage').src='img/img2.png'">Encender</button>
<button onclick="document.getElementById('myImage').src='img/img3.png'">Azul</button>

</div>
</body>
</html>
